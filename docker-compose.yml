  streamcv:
    container_name: streamcv
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu, video]
    build:
      context: .
      dockerfile: streamcv/Dockerfile
    ports:
      - "8100:8000"
    volumes:
      - ./streamcv:/app/streamcv                # Development live-reload
      - ./cvn/app/waldo:/app/waldo:ro           # ONNX model weights
      - ./cvn/app/crowd_loc/weights:/app/crowd_loc/weights:ro  # Crowd localization HRNet+ESPCN weights
      - ./cvn/app/Disaster_Classification/efficientnet_model.pth:/app/disaster_classification/efficientnet_model.pth:ro  # Disaster classification EfficientNet-B0 weights
      - ./web/django_api/aiders/media/live:/media/live    # Detection video recording
    networks:
      aidersDockerNetwork:
        ipv4_address: ${STREAMCV_IP}
    env_file:
      - ./.env
    environment:
      - STREAMCV_HOST=streamcv
      - STREAMCV_PORT=8000
      - STREAMCV_ORT_PROVIDERS=CUDAExecutionProvider,CPUExecutionProvider
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
    depends_on:
      - db

