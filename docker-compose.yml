  #   depends_on:
  #     - db

  alg:
    container_name: alg
    build:
      context: .
      dockerfile: alg/Dockerfile.alg
    volumes:
      - ./alg/app:/app # Development
      - ./_shared_code/database/connection.py:/app/database/connection.py
      - ./db_states.txt:/db_states.txt
      - ./web/django_api/aiders/media:/media:rw # django's media folder
    networks:
      aidersDockerNetwork:
        ipv4_address: ${ALG_IP}
    env_file:
      - ./.env
    depends_on:
      - db

  mav:
    container_name: mav 
    build:
      context: .
      dockerfile: mav/Dockerfile.mav
    volumes:
      - ./mav/app:/app # Development
      - ./_shared_code/database/connection.py:/app/database/connection.py
      - ./db_states.txt:/db_states.txt
      - ./web/django_api/aiders/media:/media:rw # django's media folder
    network_mode: host
    env_file:
      - ./.env
    environment:
      - DB_HOST=127.0.0.1
    # develop:
    #   watch:
    #     - path: ./mav/app
    #       target: /app
    #       action: sync+restart
    depends_on:
      - db

  ws:
    container_name: ws
    build:
      context: .
      dockerfile: ws/Dockerfile.ws
    #     dockerfile: ws/Dockerfile.ws.dev # Development
    # volumes:
    #     - ./ws/app:/application # Development
    networks:
      aidersDockerNetwork:
        ipv4_address: ${WS_IP}
    env_file:
      - ./.env
    depends_on:
      - db

  wsi:
    container_name: wsi
    build:
        context: .
        dockerfile: wsi/Dockerfile.wsi
    #     dockerfile: wsi/Dockerfile.wsi.dev # Development
    # volumes:
    #     - ./wsi/app:/application # Development
    networks:
      aidersDockerNetwork:
        ipv4_address: ${WSI_IP}
    env_file:
        - ./.env
    depends_on:
        - db

  wsm:
    container_name: wsm
    build:
        context: .
        # dockerfile: wsm/Dockerfile.wsm
        dockerfile: wsm/Dockerfile.wsm.dev # Development
    volumes:
        - ./wsm/app:/application # Development
    networks:
      aidersDockerNetwork:
        ipv4_address: ${WSM_IP}
    env_file:
        - ./.env
    depends_on:
        - db

  ccd:
    container_name: ccd
    build:
      context: .
      dockerfile: ccd/Dockerfile.ccd
    networks:
      aidersDockerNetwork:
        ipv4_address: ${CCD_IP}
    env_file:
      - ./.env
    depends_on:
      - db

  # rtmp:
  #   container_name: rtmp
  #   build:
  #     context: .
  #     dockerfile: rtmp/Dockerfile.rtmp
  #   networks:
  #     aidersDockerNetwork:
  #       ipv4_address: ${RTMP_IP}
  #   ports:
  #     - ${RTMP_PORT}:${RTMP_PORT}
  #   env_file:
  #     - ./.env

  sdi:
    container_name: sdi
    build:
      context: .
      dockerfile: sdi/Dockerfile.sdi
    networks:
      - aidersDockerNetwork
    env_file:
      - ./.env
    device_cgroup_rules:
      - c *:* rmw
    volumes:
      - /dev/:/dev/ # container access to USB devices
    depends_on:
      - db

  nginx:
    container_name: nginx
    build:
      context: .
      dockerfile: nginx/Dockerfile.nginx
    network_mode: host
    env_file:
      - ./.env
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf # Path to your Nginx configuration file
      - ./nginx/templates/default.conf.template:/etc/nginx/conf.d/default.conf.template
      # - ./nginx/templates/ssl.conf.template:/etc/nginx/conf.d/ssl.conf.template # SSLEnabled
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./web/django_api/aiders/static:/app/aiders/static:rw #Production
      - ./web/django_api/aiders/media:/app/aiders/media:rw #Production
    depends_on:
      - web
    command: /etc/nginx/entrypoint.sh
    expose:
      - "443"

  db:
    container_name: db
    build:
      context: .
      dockerfile: db/Dockerfile.db
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    networks:
      aidersDockerNetwork:
        ipv4_address: ${DB_IP}
    volumes:
      - mysql-data:/var/lib/mysql
      # - ./db-logs:/var/log/mysql:rw

  haproxy:
    container_name: haproxy
    build:
      context: .
      dockerfile: haproxy/Dockerfile.haproxy
    restart: unless-stopped
    env_file:
      - ./.env
    network_mode: host
    command: /bin/bash -c "envsubst < /usr/local/etc/haproxy/haproxy.cfg > /usr/local/etc/haproxy/haproxy.cfg.tmp && mv /usr/local/etc/haproxy/haproxy.cfg.tmp /usr/local/etc/haproxy/haproxy.cfg && haproxy -f /usr/local/etc/haproxy/haproxy.cfg && tail -f /dev/null"
    depends_on:
      - db

  odm:
    container_name: odm
    build:
      context: .
      dockerfile: odm/Dockerfile.odm
    env_file:
      - ./.env
    networks:
      aidersDockerNetwork:
        ipv4_address: ${ODM_IP}

  geo:
    container_name: geo
    build:
      context: .
      dockerfile: geo/Dockerfile.geo
    ports:
      - '8081:80'
    environment:
      ALLOW_CORS: enabled
    volumes:
      - ./geo/osm-data:/data/database/
      - ./geo/osm-data:/data/tiles/
    command:
      - run

  kc:
    container_name: kc
    build:
      context: .
      dockerfile: kc/Dockerfile.kc
    volumes:
      - ./kc/app:/app # Development
      - ./_shared_code/database/connection.py:/app/database/connection.py
      - ./db_states.txt:/db_states.txt
      - ./web/django_api/aiders/media:/media:rw # django's media folder
    networks:
      aidersDockerNetwork:
        ipv4_address: ${KC_IP}
    env_file:
      - ./.env
    depends_on:
      - db
  
  drid:
    container_name: drid
    build:
      context: .
      dockerfile: drid/Dockerfile.drid
    volumes:
      - ./drid/app:/app # Development
      - ./_shared_code/database/connection.py:/app/database/connection.py
      - ./db_states.txt:/db_states.txt
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro # D-Bus socket for Bluetooth
    # networks:
    #   aidersDockerNetwork:
    #     ipv4_address: ${DRID_IP}
    network_mode: host # Required for BLE access
    privileged: true # Required for BLE access
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - NET_RAW
    environment:
      - DB_HOST=localhost # Override for host network mode (connects via HAProxy)
    env_file:
      - ./.env
    depends_on:
      - db
  
  adsb:
    container_name: adsb
    restart: unless-stopped
    build:
      context: .
      dockerfile: adsb/Dockerfile.adsb
    volumes:
      - ./adsb/app:/app # Development
      - ./_shared_code/database/connection.py:/app/database/connection.py
      - ./db_states.txt:/db_states.txt
      - /dev:/dev # Mount all devices for RTL-SDR access
    # networks:
    #   aidersDockerNetwork:
    #     ipv4_address: ${ADSB_IP}
    network_mode: host # Required for USB device access
    privileged: true # Required for USB device access
    cap_add:
      - SYS_ADMIN
      - SYS_RAWIO
    environment:
      - DB_HOST=localhost # Override for host network mode (connects via HAProxy)
      - DUMP1090_HOST=localhost
      - DUMP1090_PORT=30003
    env_file:
      - ./.env
    depends_on:
      - db
  
  mtx:
    container_name: mtx
    build:
      context: .    
      dockerfile: mtx/Dockerfile.mtx
    # image: bluenviron/mediamtx:latest
    ports:
      # "8554:8554"   # RTSP
      - "1935:1935"   # RTMP
      #- "8888:8888"   # HLS
      - "8889:8889"   # WebRTC/Web UI
      #- "8000:8000/udp" # RTP
      #- "8001:8001/udp" # RTCP
      #- "8189:8189/udp" # WebRTC ICE
      #- "8890:8890/udp" # SRT
    volumes:
      - ./mtx/mediamtx.yml:/mediamtx.yml:ro  # Optional, if you want a custom config
      # Videos will be saved in media/{rtmp_path} 
      # for example if rtmp_url is rtmp://localhost/live/test
      # the video will be saved in media/live/test-{timestamp}.mp4 
      - ./web/django_api/aiders/media:/recordings:rw
    network_mode: host
    # networks:
    #   aidersDockerNetwork:
    #     ipv4_address: ${MEDIAMTX_IP} 
    env_file:
      - ./.env
    restart: unless-stopped
    # user: "1000:1000"  # Ensure proper file ownership

  ffrb:
    container_name: ffrb
    build:
      context: ./ffrb
    ports:
      - "5000:5000"
    network_mode: host
    env_file:
      - ./.env
    depends_on:
      - db
      - nginx




volumes:
  mysql-data:
    driver: local

networks:
  aidersDockerNetwork:
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET}
          gateway: ${GATEWAY}
