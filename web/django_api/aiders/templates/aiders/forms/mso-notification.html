<div id="mso-not-dialog" style="display:none;">
    <div class="dialog-content">
        <form id="msoNotForm" name="msoNotForm" style="display: block;">
            <input id="mso-not-sender" name="username" value="{{ user.username }}" type="hidden">

            <div class="row">
                <div class="col-12">
                    <div class="mission-popup-title">Device</div>
                    <select class="form-control" id="mso-not-device-select">
                    </select>
                </div>
            </div>

            <div class="row" style="margin-top: 10px;">
                <div class="col-12">
                    <div class="form-group">
                        <div class="mission-popup-title">Message</div>
                        <textarea class="form-control" id="mso-not-message" name="mso-not-message" rows="4"></textarea>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <p class="mso-not-error errorMessage"></p>
                </div>
            </div>
        </form>
    </div>
</div>
