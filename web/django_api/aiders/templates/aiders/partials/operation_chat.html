<!-- Chat Popup JavaScript -->
<script>
    // Chat popup functionality
    class OperationChatPopup {
        constructor() {
            this.isMinimized = false;
            this.isConnected = false;
            this.operationId = OPERATION_ID;
            this.currentUser = '{{ user.username }}';
            this.currentUserId = {{ user.id }};
            this.roomId = null;
            this.chatSocket = null;
            this.unreadCount = 0;
            this.isTyping = false;
            this.typingTimeout = null;
            this.lastMessageId = null;
            
            this.initializeElements();
            this.bindEvents();
            this.initializeChat();
        }
        
        initializeElements() {
            this.popup = document.getElementById('chat-popup');
            this.toggleBtn = document.getElementById('chat-toggle-btn');
            this.closeBtn = document.getElementById('chat-close-btn');
            this.minimizeBtn = document.getElementById('chat-minimize-btn');
            this.messagesContainer = document.getElementById('chat-popup-messages');
            this.typingIndicator = document.getElementById('chat-popup-typing');
            this.messageForm = document.getElementById('chat-popup-form');
            this.messageInput = document.getElementById('chat-popup-message-input');
            this.unreadBadge = document.getElementById('chat-unread-count');
            this.roomNameSpan = document.getElementById('chat-popup-room-name');
        }
        
        bindEvents() {
            this.toggleBtn.addEventListener('click', () => this.togglePopup());
            this.closeBtn.addEventListener('click', () => this.closePopup());
            this.minimizeBtn.addEventListener('click', () => this.toggleMinimize());
            this.messageForm.addEventListener('submit', (e) => this.sendMessage(e));
            this.messageInput.addEventListener('input', () => this.handleTyping());
        }
        
        async initializeChat() {
            try {
                // Get or create chat room for current operation
                const response = await fetch(`/chat/api/operation/${this.operationId}/room/`, {
                    headers: {
                        'X-CSRFToken': document.getElementById('csrf').querySelector('input').value,
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    this.roomId = data.room_id;
                    this.roomNameSpan.textContent = data.room_name;
                    await this.connectWebSocket();
                    await this.loadRecentMessages();
                } else {
                    console.error('Failed to initialize chat room');
                }
            } catch (error) {
                console.error('Error initializing chat:', error);
            }
        }
        
        async connectWebSocket() {
            if (!this.roomId) return;
            
            const wsScheme = window.location.protocol === 'https:' ? 'wss' : 'ws';
            const wsPath = `${wsScheme}://${window.location.host}/ws/chat/${this.roomId}/`;
            
            this.chatSocket = new WebSocket(wsPath);
            
            this.chatSocket.onopen = () => {
                console.log('Chat WebSocket connected');
                this.isConnected = true;
                this.updateConnectionStatus(true);
            };
            
            this.chatSocket.onmessage = (e) => {
                const data = JSON.parse(e.data);
                this.handleWebSocketMessage(data);
            };
            
            this.chatSocket.onclose = () => {
                console.log('Chat WebSocket disconnected');
                this.isConnected = false;
                this.updateConnectionStatus(false);
                // Attempt to reconnect after 3 seconds
                setTimeout(() => this.connectWebSocket(), 3000);
            };
            
            this.chatSocket.onerror = (error) => {
                console.error('Chat WebSocket error:', error);
                this.updateConnectionStatus(false);
            };
        }
        
        async loadRecentMessages() {
            try {
                const response = await fetch(`/chat/api/room/${this.roomId}/messages/`, {
                    headers: {
                        'X-CSRFToken': document.getElementById('csrf').querySelector('input').value,
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    this.messagesContainer.innerHTML = '';
                    
                    data.messages.slice(-20).reverse().forEach(message => {
                        console.log('Loading message:', message);
                        
                        this.addMessageToUI(message);
                    });
                    
                    this.scrollToBottom();
                }
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }
        
        handleWebSocketMessage(data) {
            switch (data.type) {
                case 'chat_message':
                    this.addMessageToUI(data);
                    if (!this.isPopupVisible() && data.user_id !== this.currentUserId) {
                        this.incrementUnreadCount();
                    }
                    break;
                case 'typing_indicator':
                    this.handleTypingIndicator(data);
                    break;
            }
        }
        
        addMessageToUI(messageData) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-popup-message ${messageData.user_id === this.currentUserId ? 'own' : ''}`;
            
            const timestamp = new Date(messageData.timestamp);
            const timeStr = timestamp.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            
            messageDiv.innerHTML = `

                <div class="chat-popup-message-content">
                    <div class="chat-popup-message-header">
                        <span class="chat-popup-message-author">${messageData.user}</span>
                        <span class="chat-popup-message-time">${timeStr}</span>
                    </div>
                    <div class="chat-popup-message-text">
                        ${messageData.content}
                    </div>
                </div>
            `;
            
            this.messagesContainer.appendChild(messageDiv);
            this.scrollToBottom();
            this.lastMessageId = messageData.message_id;

            let audioPath = document.querySelector('#audioPathDing').dataset.path;
            let audio = new Audio(audioPath); // Create a new Audio object
            audio.play(); // Play the audio
        }
        
        handleTypingIndicator(data) {
            if (data.is_typing && data.user_id !== this.currentUserId) {
                document.getElementById('chat-popup-typing-users').textContent = data.user;
                this.typingIndicator.style.display = 'block';
                
                setTimeout(() => {
                    this.typingIndicator.style.display = 'none';
                }, 3000);
            }
        }
        
        sendMessage(e) {
            e.preventDefault();
            const message = this.messageInput.value.trim();
            
            if (message && this.isConnected) {
                this.chatSocket.send(JSON.stringify({
                    'type': 'chat_message',
                    'message': message
                }));
                
                this.messageInput.value = '';
                
                if (this.isTyping) {
                    this.sendTypingIndicator(false);
                    this.isTyping = false;
                }
            }
        }
        
        handleTyping() {
            if (!this.isTyping) {
                this.sendTypingIndicator(true);
                this.isTyping = true;
            }
            
            clearTimeout(this.typingTimeout);
            this.typingTimeout = setTimeout(() => {
                this.sendTypingIndicator(false);
                this.isTyping = false;
            }, 1000);
        }
        
        sendTypingIndicator(isTyping) {
            if (this.isConnected) {
                this.chatSocket.send(JSON.stringify({
                    'type': 'typing',
                    'is_typing': isTyping
                }));
            }
        }
        
        togglePopup() {
            if (this.isPopupVisible()) {
                this.closePopup();
            } else {
                this.openPopup();
            }
        }
        
        openPopup() {
            this.popup.style.display = 'flex';
            this.resetUnreadCount();
            this.scrollToBottom();
            this.messageInput.focus();
        }
        
        closePopup() {
            this.popup.style.display = 'none';
            this.isMinimized = false;
            this.popup.classList.remove('minimized');
        }
        
        toggleMinimize() {
            this.isMinimized = !this.isMinimized;
            if (this.isMinimized) {
                this.popup.classList.add('minimized');
            } else {
                this.popup.classList.remove('minimized');
                this.scrollToBottom();
            }
        }
        
        isPopupVisible() {
            return this.popup.style.display !== 'none' && !this.isMinimized;
        }
        
        incrementUnreadCount() {
            this.unreadCount++;
            this.updateUnreadBadge();
        }
        
        resetUnreadCount() {
            this.unreadCount = 0;
            this.updateUnreadBadge();
        }
        
        updateUnreadBadge() {
            if (this.unreadCount > 0) {
                this.unreadBadge.textContent = this.unreadCount > 99 ? '99+' : this.unreadCount;
                this.unreadBadge.style.display = 'flex';
            } else {
                this.unreadBadge.style.display = 'none';
            }
        }
        
        updateConnectionStatus(connected) {
            // Could add connection status indicator if needed
        }
        
        scrollToBottom() {
            this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
        }
    }
    
    // Initialize chat popup when page loads
    document.addEventListener('DOMContentLoaded', function() {
        window.operationChat = new OperationChatPopup();
    });

</script>
