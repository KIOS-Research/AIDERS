<div id="mavlinkLogsWrapper" 
    style="display: none; position: absolute; left: 305px; bottom: 60px; padding:5px; width: 420px; max-height: 155px; background-color: #333; color: orange; opacity: 0.99; z-index: 1000;">
    <div style="font-weight: bold; font-size: 14px; border-bottom: 1px solid orange; margin-bottom: 5px;"><i class="fa fa-exclamation-triangle" style="color: orange;"></i> MAVLink Logs</div>
    <a id="closeMavlinkLogsBtn" style="border: 1px solid orange; font-size: 8px; font-weight: bold; position: absolute; right: 0px; top: 0px; margin: 4px 6px; padding: 2px 6px;" action="#" class="btn">X</a>
    <div id="mavlinkLogs" 
        style="max-height: 120px; overflow-y: auto; font-size: 12px;">
    </div>        
</div>

<a id="openMavlinkLogsBtn" style="display: none; background-color: #333; color: orange; border: 1px solid orange; font-size: 12px; font-weight: bold; position: absolute; left: 300px; bottom: 26px; margin: 5px 5px; padding: 2px 6px;" action="#" class="btn">
    <i class="fa fa-exclamation-triangle" style="color: orange;"></i> MAVLink Logs
</a>




<script>
window.addEventListener('load', function () {
    
    let lastMavlinkLogId = 0;
    let numberOfChecksWithNoMavlinkConnected = 0;

    function updateMavlinkLogs(_onPageLoad) {
        // console.log(allDroneInfo);

        // Check if a mavlink drone is connected
        var mavlinkConnected = false;
        const mavlinkDrones = Array.isArray(allDroneInfo)
            ? allDroneInfo.filter(obj => obj.droneType === "MAVLINK")
            : [];

        // console.log("MAVLink drones:", mavlinkDrones);
        for (let i = 0; i < mavlinkDrones.length; i++) {
            if(mavlinkDrones[i].isConnected ) {
                // console.log("Connected MAVLink drone found: " + mavlinkDrones[i].droneID);
                mavlinkConnected = true;
                numberOfChecksWithNoMavlinkConnected = 0;  // reset disconnect checks if a connected drone is found
                break;  // exit loop if at least one connected drone is found
            }
        }
        if (!mavlinkConnected && numberOfChecksWithNoMavlinkConnected > 3) {
            // console.log("No Connected MAVLink drones found.");
            return;
        }
        // console.log("Updating MAVLink logs... Last log ID: " + lastMavlinkLogId);
        numberOfChecksWithNoMavlinkConnected++;
        
        $.ajax({
            url: '/mavlinkGetLogs/' + OPERATION_ID + '/' + lastMavlinkLogId,
            method: 'GET',
            success: function(logs) {
                let logDiv = $('#mavlinkLogs');
                logs.forEach(function(log) {
                    var date = new Date(log.time);
                    var formattedTime = date.toLocaleString();                            
                    logDiv.append('<div>' + formattedTime + ' - <b>' + log.drone__drone_name + '</b> - ' + log.message + '</div>');
                    if (log.id > lastMavlinkLogId) {
                        lastMavlinkLogId = log.id;  // update lastMavlinkLogId
                    }
                });
                if(logs.length > 0) {
                    if(_onPageLoad) {
                        hideMavlinkLogsDiv();
                    }
                    else {
                        showMavlinkLogsDiv();
                        let audioPath = document.querySelector('#audioPathDing').dataset.path;
                        let audio = new Audio(audioPath); // Create a new Audio object
                        audio.play(); // Play the audio                  
                    }
                    logDiv[0].scrollTop = logDiv[0].scrollHeight;  // scroll to bottom
                }
            }
        });
    }

    updateMavlinkLogs(true);  // call once to get all logs
    setInterval(function() {
        updateMavlinkLogs(false);
        // console.log("Checking for new MAVLink logs...");
        
    }, 3000);    // start polling

    function showMavlinkLogsDiv() {
        $('#mavlinkLogsWrapper').show();
        // $('#openMavlinkLogsBtn').hide();
    }

    function toggleMavlinkLogsDiv() {
        $('#mavlinkLogsWrapper').toggle();
    }

    function hideMavlinkLogsDiv() {
        $('#mavlinkLogsWrapper').hide();
        $('#openMavlinkLogsBtn').show();
    }
    
    $('#closeMavlinkLogsBtn').click(function() {
        hideMavlinkLogsDiv();
    });
    $('#openMavlinkLogsBtn').click(function() {
        toggleMavlinkLogsDiv();
    });
});
</script>
